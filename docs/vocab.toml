[[concept]]
name       = "degradation_spec"
id_type    = "DegradationId"
owner      = "PART-II/degradation"
definition = "An ordered list of (operator, parameters, seed) defining one matrix cell."

[[concept]]
name       = "run_manifest"
id_type    = "RunId"
owner      = "PART-II/determinism"
definition = "The hashed core of one execution: all input digests, git SHA, toolchain versions, seeds."

[[concept]]
name       = "oracle"
id_type    = "OracleId"
owner      = "62"
definition = "An independently implemented judge of a property; a closed set of five."

# ---------------------------------------------------------------------------
# Retired terms. Section 57.9: a retired term cannot be justified, only replaced. No allowlist
# applies. Check V6 rejects any occurrence as an identifier segment, a JSON key, a TOML key, a SQL
# column or an OpenAPI field.
#
# Table A row 14 records `atom` as RETIRED with owner section 57; it is represented here as a
# [[retired]] entry rather than a [[concept]] entry, following the example in section 57.9.
# ---------------------------------------------------------------------------
[[retired]]
name   = "atom"
reason = "Meant both 'fact' and 'threshold literal' in Part I; ambiguous across five languages."
use    = ["fact", "threshold_literal"]

