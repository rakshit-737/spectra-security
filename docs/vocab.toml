owner      = "20"
definition = "The provenance structure of one grounding: OR-nodes are facts, AND-nodes are rule instances."

[[concept]]
name       = "hypothesis"
id_type    = "HypothesisId"
owner      = "25"
definition = "One derivation of one goal fact: its instance set, its license set, and its realizability status."

[[concept]]
name       = "certificate"
id_type    = "CertId"
owner      = "PART-II/certificate"
definition = "The content-addressed proof artifact the kernel emits and `spectra verify` checks."

[[concept]]
name       = "verdict"
id_type    = "-"
owner      = "PART-II/verdict-algebra"
definition = "The pair `safety` x `minimality` plus its mandatory scope binding; never a single word."

[[concept]]
name       = "flag"
id_type    = "FlagId"
owner      = "PART-II/verdict-algebra"
definition = "A named boolean recording a degraded condition of a run; a closed set."

[[concept]]
name       = "scenario"
id_type    = "ScenarioId"
owner      = "5"
definition = "A named, seeded, versioned attack narrative the generator realizes deterministically."

[[concept]]
name       = "degradation_operator"
id_type    = "OperatorId"
owner      = "PART-II/degradation"
