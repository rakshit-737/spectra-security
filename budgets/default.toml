# ---------------------------------------------------------------------------
# Negative requirements
# ---------------------------------------------------------------------------
#
# - Do not add a key whose unit is seconds, milliseconds, nanoseconds of wall clock, or any other
#   measure of elapsed time. Not for the kernel, not for the checker, not "just for CI".
# - Do not add a key whose unit is resident set size, virtual memory, or any allocator statistic.
#   The memory ceiling is `arena_cells` and it is counted, not observed.
# - Do not check a budget by sampling, by a background thread, or by a signal handler.
# - Do not raise a budget to make a fixture pass. Section 69.10.5 requires a deliberate revision
#   with a rationale, on evidence from the published budget_used distribution.
# - Do not treat exit 7 as a crash, and do not treat INFRA_KILLED as exit 7. They are different
#   events with different artifacts and different CI meanings.
# - Do not present a budget-exhausted run as ROBUST. The type system forbids it; do not work around
#   the type system.
