# spectra_vs - the vertical slice stages. Python reference implementation, ADR-0013.
# Standard library only: no pip, no network, no third-party import, ever.

[project]
name = "spectra-vs"
version = "0.0.0"
description = "SPECTRA vertical slice stages. Python reference implementation."
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_vs"]
