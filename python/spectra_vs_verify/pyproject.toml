# spectra_vs_verify - the certificate checker.
#
# A SEPARATE top-level package that imports nothing from spectra_vs. That is module
# independence and not implementation independence: both sides are Python written in one
# session by one author from one reading of one specification, and both share
# spectra_core for the octet encoders and the digest. A shared misreading is invisible to
# this package, and a certificate it accepts is not independently verified.

[project]
name = "spectra-vs-verify"
version = "1.1"
description = "SPECTRA slice certificate checker. Module independence only."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_vs_verify"]
