# spectra_ingest - parsers, normalizers, entity resolution, chain verification.
# Spec: Part I 32.3, 10; Part II 59 (ingest), 60 (entity resolution).
# Status: not started.

[project]
name = "spectra-ingest"
version = "0.0.0"
description = "SPECTRA ingest: parse, normalize, resolve, verify chains. Not started."
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = []
# TODO(dependencies): added in the commit that uses them (Part II 74.2).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
# TODO(pin): see python/spectra_core/pyproject.toml.

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_ingest"]
