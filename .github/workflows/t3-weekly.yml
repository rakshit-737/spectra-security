        run: |
          echo "not implemented: G-CERT-MUTATION"
          exit 1

  # NOT IMPLEMENTED - skipped, not passing.
  # Class: kernel mutation score (43.5.4). The real gate on the kernel.
  mutation-kernel:
    name: T3 mutation / kernel surviving-mutant ratio (NOT IMPLEMENTED)
    if: false # enabled at M5 (two-sided minimal cut and certificate)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: not implemented
        run: |
          echo "not implemented: G-MUTATION-PY"
          echo "not implemented: G-MUTATION-RS"
          exit 1

  # NOT IMPLEMENTED - skipped, not passing.
  # Class: long-horizon checker parser fuzz (74.4: cost scales with time
  # budget, so a short run lives in T2 and the long run lives here).
  fuzz-long:
    name: T3 fuzz / long-horizon checker parser fuzz (NOT IMPLEMENTED)
    if: false # enabled at M6 (independent Go checker and differential gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: not implemented
        run: |
          echo "not implemented: G-CERT-FUZZ-LONG"
          exit 1

  # NOT IMPLEMENTED - skipped, not passing.
  # Class: published performance numbers (74.4: T3 only; the variance protocol
  # needs a quiet runner). 46.7: raw samples alongside summaries, hardware and
