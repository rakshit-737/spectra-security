# T1 - the per-push and per-pull-request tier.
#
# Authority: ci/gates.toml. This file runs gates; it does not declare them.
# Section 74.4 (Part II): "Every gate is a row in ci/gates.toml. There is no
# other place a gate may be declared." If a job here names a gate id that is not
# in the registry, or a registry row assigned to T1 has no job here, G-REG-001
# fails. A check that appears in this file without a gate id is not a gate.
#
# STATUS: not started.
#
# Exactly one job below runs: `skeleton`. Every other job is declared and
# explicitly skipped with `if: false`, a stated reason and the milestone that
# enables it. A skipped job renders grey in the GitHub UI. It is not a pass, it
# must never be added to the branch-protection required-check list, and it must
# never be described as green. None of these gates has ever run, so none of them
# has ever passed.
#
# ON `if: false`
#   Section 73 forbids silencing a red Tier C or D job with `continue-on-error`
#   or an `if: false` guard. That prohibition is about hiding a job that HAS run
#   and HAS failed. The guards below sit on jobs whose gate is not written yet:
#   there is no result to hide. Each one states its enabling milestone, and each
#   one is deleted by the commit that implements the gate. Using `if: false` on a
#   job that has ever produced a result is the defect section 73 names.
#
# ON RETRIES
#   Section 74.8.1: automatic retry is forbidden. `continue-on-error`,
#   `retries:`, `--rerun-failed` and every equivalent are banned, and G-FLAKE-001
#   is the linter that greps this directory for them. Do not add one here.
#
# TIER CEILING: 20 min end-to-end for all jobs (74.4, illustrative, not a
#   target). Per-job `timeout-minutes` below are derived from each class's
#   budget_s in ci/gates.toml, rounded up. Every one of those numbers is
#   illustrative and not a target; none has been measured.
#
# TODO(budget): ci/gates.toml currently declares more T1 seconds than the T1
#   ceiling allows, and says so in its budget summary. That must be reconciled
#   before any job below is enabled. See TODO(budget) in ci/gates.toml.
#
# TODO(runner): every enabled job must eventually run in
#   spectra/toolchain-a@sha256:<digest from images.lock> (74.1, G-IMG-001). The
#   skeleton job runs on a bare runner because no toolchain image has been built
#   and images.lock does not exist. Add `container:` to each job as its gate
#   lands; until then a `container:` line here would reference a digest nobody
#   can resolve.

name: t1

on:
  push:
  pull_request:

# 74.7
concurrency:
  group: t1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C
  SPECTRA_OFFLINE: "1"
  SOURCE_DATE_EPOCH: "0"

defaults:
  run:
    shell: bash

jobs:

  # ENABLED.
  # The only gate this directory runs. It is not the only implemented gate in
  # the repository: G-WIN-001 (T0) is implemented too, as the sandbox guard at
  # Makefile lines 51-61, and is enforced locally by .pre-commit-config.yaml
  # rather than here.
  # It gates the skeleton and nothing else: it does not build, exercise or
  # verify any part of the platform, because no part of the platform exists.
  skeleton:
    name: T1 skeleton / G-SKELETON-001
    runs-on: ubuntu-24.04
    # G-SKELETON-001 declares budget_s = 30 (illustrative, not a target). The
    # job timeout is larger because it also covers checkout.
    timeout-minutes: 5
    steps:
      # TODO(pin): 74.11.2 requires every action pinned to a full commit SHA.
      # The SHA below is actions/checkout v4.2.2. Verify it against the upstream
      # tag on the first real run and record the check in ci/ledger/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make skeleton-verify
        run: make skeleton-verify

  # NOT IMPLEMENTED - skipped, not passing.
  # Class: gate registry, CI budget, flake policy, sampling scope (74.4-74.9)
  registry:
    name: T1 registry / gates, budget, flake, sampling (NOT IMPLEMENTED)
    if: false # enabled at M0 (skeleton and toolchain), with the registry linter
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: not implemented
        run: |
          echo "not implemented: G-REG-001"
          echo "not implemented: G-BUDGET-001"
          echo "not implemented: G-FLAKE-001"
          echo "not implemented: G-FLAKE-003"
          echo "not implemented: G-SAMP-001"
          exit 1

  # NOT IMPLEMENTED - skipped, not passing.
  # Class: repository hygiene on a Windows/WSL2 host (74.10)
  repo-hygiene:
