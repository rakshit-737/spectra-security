# T2 - the nightly tier, main only.
#
# Authority: ci/gates.toml. This file runs gates; it does not declare them
# (74.4). A check here without a gate id in the registry is not a gate.
#
# STATUS: not started. Every job below is declared and explicitly skipped with
# `if: false`, a stated reason and the milestone that enables it. A skipped job
# renders grey; it is not a pass. No job in this file has ever run.
#
# There is no enabled job in this workflow. The skeleton gate that the T1
# workflow runs is a T1 gate and runs there, once, per push. Repeating it here
# would give T2 a green check that says nothing about any T2 gate.
#
# MEANING OF A FAILURE (74.4): an issue is auto-filed, the milestone loses its
# green, and main is marked degraded in the README status table. A T2 failure
# does not block a merge, and it is never silenced.
#
# 74.0 OVERRIDES 43.1: Tier C and Tier D language jobs, the polyglot mutation
# audit and the Tier B oracle gates run here, not per-PR. A Tier C or D failure
# never blocks a Tier A milestone. Demotion to this tier is not silencing: the
# job runs, the result is recorded, and section 73 forbids hiding it.
#
# 74.0 OVERRIDES 52.1: "green twice in a row on a clean clone" is a T2
# obligation, not a per-push one.
#
# TIER CEILING: 90 min (74.4, illustrative, not a target). Per-job
# `timeout-minutes` are derived from budget_s in ci/gates.toml and are likewise
# illustrative. Nothing here has been measured.
#
# TODO(budget): ci/gates.toml declares more T2 seconds than this ceiling allows
# and says so in its budget summary. Reconcile before enabling any job here.
# 74.9 permits three remedies and no others: sample it, demote it, or delete the
# requirement. Raising the ceiling is not one of them.
#
# TODO(runner): T2 gates run in spectra/toolchain-b, -c or -d
# @sha256:<digest from images.lock> (74.1). No image has been built, so no job
# below carries a `container:` line. Add it as each gate lands, under G-IMG-001.
#
# 74.8.1: no retry, no continue-on-error, no rerun-failed. G-FLAKE-001 greps
# this directory for them.

name: t2-nightly

on:
  schedule:
    # 02:00 UTC daily. The repository runs at TZ=UTC everywhere (58, 74.3);
    # a local-time schedule would drift twice a year.
    - cron: "0 2 * * *"
  workflow_dispatch:

# 74.7: a run whose artifacts back a published number is never cancelled.
concurrency:
  group: t2-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C
  SPECTRA_OFFLINE: "1"
  SOURCE_DATE_EPOCH: "0"

