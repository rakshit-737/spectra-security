# section 61.4 then catalogs nine operators, adding BACKDATE and CHAIN-FORGE.
# Section 57 declares itself normative over every other section; section 61 declares itself the sole
# owner of perturbation operators.
# RESOLUTION TAKEN HERE: follow section 61, because section 61 retires "suppress" explicitly and
# section 57's row still carries the retired word. The nine names above are used.
# TO CHANGE: edit Table C in section 57 and the [[concept]] row for `degradation_operator` in
# docs/vocab.toml in one commit, then update this list. Do not resolve it by writing code that
# accepts both sets.

# ---------------------------------------------------------------------------
# Matrix cells.
#
# A cell is identified by the BLAKE3 of the canonical JSON of its full input (Part II section
# 61.9.1) and is defined by a perturbation plan, a seed and a sampling count. Plans are authored
# files under `plans/` (Part II section 61.2), validated by
# `schemas/degradation-plan.schema.json`, and referenced by hash.
#
# ZERO cells are configured. There are no plans, no seeds, no sampling counts and no results.
# Nothing below is a placeholder to be filled with a plausible number: a cell is added only when
# its plan exists, its schema validates it and its seed is recorded.
# ---------------------------------------------------------------------------

# (no [[cell]] entries)

# ---------------------------------------------------------------------------
# Results table.
#
# Part II section 61.11 defines the per-cell metrics and section 61.12 the gates over them. No
# metric has been measured. The table is emitted here with every row marked "not measured" so that
# no reader mistakes an absent number for a good one.
# ---------------------------------------------------------------------------
#
#   quantity                            value
#   ----------------------------------  -----------
#   cells defined                       0
#   seeds per cell                      not measured
#   record_retention(src)               not measured
#   record_retention(dim)               not measured
#   source_coverage                     not measured
#   step_witness_coverage(dim)          not measured
#   false ROBUST verdicts               not measured
#   ROBUST yield                        not measured
#   realized vs target deviation        not measured
#
# The zero-false-ROBUST invariant is the headline result of this axis and it is NOT ESTABLISHED.
# No count has been taken. Do not state or imply otherwise anywhere in the repository.

# ---------------------------------------------------------------------------
# Negative requirements
# ---------------------------------------------------------------------------
#
# - Do not define an operator here. Section 61 owns the catalog.
# - Do not define a completeness number here. Section 61.6 owns the definitions.
# - Do not aggregate the four completeness quantities into one scalar, ever, anywhere.
# - Do not label a plot axis or a table column with the TARGET retention when the REALIZED value was
#   used, or the reverse. Part II section 61.6.
# - Do not author a probability or fraction as an IEEE float. Fractions are decimal strings
#   converted to exact rationals at load time. Part II section 61.2, lint plan-lint-floats.
# - Do not add a cell without a seed.
# - Do not report a matrix number that `make bench` did not regenerate from scratch.
