# NOTE: 74.4: degradation-matrix spine cells run in T1 as a sampled gate.
# The full matrix is G-KERNEL-FALSE-ROBUST-FULL and all seeds are
# G-KERNEL-FALSE-ROBUST-SEEDS. 74.5: no artifact from this gate may describe
# the whole space.
[[gate]]
id = "G-KERNEL-FALSE-ROBUST"
title = "zero false ROBUST on declared suppression classes, spine cells plus a declared sample"
tier = "T1"
owner_section = 62
make_target = "gate-false-robust"
sampled = true
soundness = true
artifact = "false-robust-matrix.json"
budget_s = 90  # illustrative, not a target

  # 74.5 requires a sampling block on every sampled gate. The stride must
  # be coprime with the cardinality of the cell space, and that cardinality
  # is unknown until the space is enumerated.
  # TODO(sampling): recompute stride from the measured cardinality when the
  # space is enumerated, assert coprimality, and record both in sample-plan.json.
  [gate.sampling]
  algorithm   = "stride-rotation/v1"
  epoch_file  = "ci/epoch.txt"
  k           = 24     # illustrative, not a target
  stride      = 271    # illustrative, not a target
  spine       = "completeness 100 and 30 at both ends, each degradation operator at least once, each declared suppression class at least once"
  claim_scope = "SAMPLED"

