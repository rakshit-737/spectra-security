# ci/gates.toml - the SPECTRA gate registry.
#
# Section 74.4 (Part II): every gate is a row in this file and there is no other
# place a gate may be declared. Section 74.0 is why this file exists at all:
# "a requirement with no gate id is not a requirement". A workflow job, a
# Makefile target or a sentence in docs/ that claims to gate something without a
# row here is a defect, not a gate. The tier model is documented once, in
# .github/workflows/README.md; it is not repeated here.
#
# STATUS: not started. Exactly five gates below are IMPLEMENTED: G-SKELETON-001,
# which gates this skeleton and nothing else; G-PYREF-001, which runs every unit
# suite of the Python reference slice (ADR-0013); G-VS-PREREG-0001, which re-runs
# the slice's two pre-registered predictions end to end; G-FE-001, which runs the
# certificate viewer's own suites on the CI node runtime; and G-WIN-001, which is
# the Makefile sandbox guard, evaluates on every make invocation in this
# repository, and is enforced before every commit by .pre-commit-config.yaml.
# Every other gate below is DECLARED only. Declaring a gate does not make it run;
# the tier workflows carry the enablement state, and every job except the
# skeleton, reference, prereg and frontend jobs is explicitly skipped with its
# reason and its enabling milestone stated there. No gate below other than those
# five has ever passed, because no gate below other than those five has ever run.
#
# FIELDS (74.4)
#   id             stable identifier, referenced by docs, workflows and the ledger
#   title          what the gate proves, in the spec's words where it has them
#   tier           exactly one of T0 | T1 | T2 | T3; G-REG-001 enforces exactly one
#   owner_section  the spec section that owns the obligation
#   make_target    the target the tier workflow invokes; it must exist (G-REG-001)
#   sampled        true requires a [gate.sampling] block (74.5)
#   soundness      true means non-quarantinable (74.8.6)
#   artifact       the file the gate produces; retention governed by 74.7
#   budget_s       a DECLARED CEILING enforced by a per-job timeout, never a measurement
#
# UNRECONCILED: MOST make_target VALUES NAME NO RULE IN THE MAKEFILE
#   176 of the 203 rows below name a make_target with no rule in the Makefile.
#   G-REG-001, once implemented, fails on this registry as written. That is the
#   gate working, not the gate misconfigured.
#
#   TODO(targets): add each target as a $(call todo,...) stub, or delete the row.
#
# ON budget_s: every value is illustrative and not a target. Nothing here has
#   been measured. A budget is raised only through a reviewed diff of this file,
#   never silently, and never to make a slow gate fit (74.9: demote it instead).
#
# ON TIERS: 74.4's tier table is normative and OVERRIDES the "per-PR" wording of
#   sections 43, 60, 64, 68 and 70. Where 74.4 lists a class in two tiers ("T1
#   spine subset / T2 full corpus") that is two gates with two ids, because a
#   gate has exactly one tier. Where a T2 row below carries no note, the reason
#   it is not in T1 is that 74.4 does not place its class there.
#
# ON T0: 74.4 defines T0 as a local pre-commit tier that is never authoritative.
#   Only checks makeable solely on a developer's own clone are registered at T0.
#   The "T0 + T1" lint class is registered at T1, the authoritative tier, and
#   mirrored without authority by .pre-commit-config.yaml.
#
# UNRECONCILED: THIS REGISTRY EXCEEDS ITS OWN TIER CEILINGS
#   The budget summary at the foot of this file is arithmetic, not opinion: the
#   sum of budget_s in T1, T2 and T3 exceeds the ceiling 74.4 declares for each.
#   It is recorded rather than hidden because it is the finding this registry
#   exists to produce - Part I and Part II between them name every gate below,
#   and 74.4 declares a CI budget sized for a fraction of them. Both cannot hold.
#
#   TODO(budget): reconcile before G-BUDGET-001 is enabled, which is a
#   precondition of closing M0. 74.9 permits three remedies and no others, and
#   they are applied until each tier's sum fits:
#     1. SAMPLE - set sampled = true and add a [gate.sampling] block so the tier
#                 runs a declared deterministic subset (74.5). The artifact then
#                 carries claim_scope = "SAMPLED" and may not back a docs
#                 sentence (G-SAMP-001).
#     2. DEMOTE - move the gate to a slower tier, in this file, in the diff.
#     3. DELETE - delete the requirement the gate enforces, from the section that
#                 states it, in the same commit (74.0).
#   Raising a budget_s, widening a ceiling, or quietly dropping a row is none of
#   the three and is a defect.
#
# TODO(ids): section 62 names its gates `gate:<name>` with no ids except
#   G-KERNEL-FALSE-ROBUST; section 65 names its gates G65.1 to G65.9; sections
#   63, 64, 68, 69, 70 and 76 name gates only by make target. Every id the spec
#   states is preserved verbatim; the rest are derived as G-<AREA>-<NAME> from
#   the target, following the one worked example in 74.4 (gate:false-robust ->
#   make target gate-false-robust). To change the convention: rename here, then
#   re-run the docs and ledger link check, because ids are referenced from
#   docs/claims.md and ci/ledger/.

schema_version = 1

# Tier ceilings, restated from 74.4 so G-BUDGET-001 reads one source of truth.
# All four are illustrative, not targets.
[tier_ceiling]
T0 = 60  # illustrative, not a target
T1 = 1200  # illustrative, not a target
T2 = 5400  # illustrative, not a target
T3 = 21600  # illustrative, not a target


# ---- TIER T0 - 3 gates declared, 1 implemented (G-WIN-001). --------------
# Local pre-commit tier. Runs inside WSL2 or the devcontainer. Never
# authoritative: a green T0 proves nothing to anyone but the author.

[[gate]]
id = "G-WIN-001"
title = "the Makefile guard refuses to run from a Windows drive mount or outside WSL2, the devcontainer or CI"
tier = "T0"
owner_section = 74
make_target = "guard-sandbox"
sampled = false
soundness = false
artifact = "guard-sandbox.txt"
budget_s = 2  # illustrative, not a target

