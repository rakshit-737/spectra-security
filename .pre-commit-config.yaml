# T0 - the local pre-commit tier.
#
# STATUS: not started. Two hooks run (`skeleton-verify` and `guard-sandbox`).
# The other two are declared and parked on the `manual` stage because their make
# targets are not written yet. See "WHAT `manual` MEANS HERE" below; it does not
# mean optional.
#
# Authority: ci/gates.toml (section 74.4). Every hook below corresponds to a gate
# row there, and a hook here that does not is not a gate. This file declares
# nothing; it runs things the registry declares.
#
# WHAT THIS TIER IS, AND IS NOT
#   Section 74.4: T0 is "pre-commit hook, local, inside WSL2", ceiling 60 s
#   (illustrative, not a target), and "never authoritative". A green pre-commit
#   run proves something to the author and nothing to anyone else. The
#   authoritative answer for any lint-class check is its T1 run in
#   .github/workflows/t1.yml. Nothing in this file may be cited, reported as a
#   gate result, or counted toward a milestone.
#
#   74.4 lists the lint class as "T0 + T1". A gate has exactly one tier
#   (G-REG-001), so each such gate is registered at T1 - the authoritative tier -
#   and mirrored here without authority. `skeleton-verify` below is exactly that:
#   a local mirror of the T1 gate G-SKELETON-001.
#
# NO NETWORK
#   Every hook uses `repo: local` with `language: system`. There is no remote
#   `repo:` entry anywhere in this file, so `pre-commit install --install-hooks`
#   clones nothing and `pre-commit run` fetches nothing. That is deliberate and
#   is not a convenience: section 74.11.1 forbids installing anything from the
#   network as part of a check, and `make toolchain-refresh` is the only target
#   permitted to touch the network at all. A hook that pulled a linter from a
#   remote revision would make the local tier depend on an unpinned resolver.
#
#   The cost is that every hook's tool must already exist in the environment -
#   WSL2 with the pinned toolchain, or the devcontainer. That is the supported
#   development environment anyway (74.10.3).
#
# WHAT `manual` MEANS HERE
#   `stages: [manual]` on a hook below means NOT IMPLEMENTED, not "optional" and
#   not "skipped because it is noisy". The hook does not run on commit because
#   its make target does not exist. Run one deliberately with:
#
#       pre-commit run --hook-stage manual <id>
#
#   and it will print what is missing and exit non-zero, because that is what an
#   unimplemented make target in this repository does. Nothing here exits 0
#   having done nothing.
#
#   Each parked hook names the milestone that moves it back to the commit stage.
#   Moving a hook off `manual` and implementing its target are the same commit.
#
# SPEED
#   T0's ceiling is 60 s for the whole tier. A hook that grows past its declared
#   budget_s in ci/gates.toml is demoted or sampled, never given a bigger number
#   (74.9). Every one of those numbers is illustrative and has not been measured.
#
# NOT IN THIS FILE, ON PURPOSE
#   No formatter that rewrites files. A hook that silently edits the tree makes
#   a commit that the author did not read, and the line-ending and golden-byte
#   gates (G-WIN-002, G-WIN-004, G-DET-GOLDEN) are precisely the things such a
#   rewrite breaks. Formatting is `make fmt`, run on purpose, and `make
#   fmt && git diff --exit-code` is checked in T1.
#
#   No retry, no `|| true`, no `continue-on-error` equivalent. G-FLAKE-001 greps
#   for them (74.8.1).

minimum_pre_commit_version: "3.5.0"

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

# Report every failing hook, not just the first. A partial report invites a
# second commit attempt that fails on the next thing.
fail_fast: false

repos:
  - repo: local
    hooks:

      # ----------------------------------------------------------------------
      # ENABLED.
      # Non-authoritative local mirror of the T1 gate G-SKELETON-001, the only
      # implemented gate in this repository. It checks that the committed
      # skeleton is self-consistent. It does not build, exercise or verify any
      # part of the platform, because no part of the platform exists.
      # ----------------------------------------------------------------------
      - id: skeleton-verify
        name: "T0 skeleton-verify (mirror of T1 G-SKELETON-001, not authoritative)"
        entry: make skeleton-verify
        language: system
        pass_filenames: false
        always_run: true
        description: >-
          Runs the same target the T1 skeleton job runs. A pass here is not a
          gate result; the authoritative run is in .github/workflows/t1.yml.

      # ----------------------------------------------------------------------
      # ENABLED.
      # Gate: G-WIN-001 (T0, section 74.10.2)
      # Implemented inline in the Makefile (lines 51-61); moving it to
      # ci/guard.mk is an M0 refactor and does not change what it checks.
      # Refuses to build when the repository is on a Windows drive mount
      # (/mnt/...) or outside WSL2, the devcontainer and CI. Working from /mnt/c
      # produces case-insensitive path collisions, wrong file modes and far
      # slower I/O, all of which corrupt determinism gates. This is the cheapest
      # possible check and it prevents a whole class of confusing failures, so
      # it belongs before the commit rather than after the push.
      # ----------------------------------------------------------------------
      - id: guard-sandbox
        name: "T0 guard-sandbox / G-WIN-001"
        entry: make guard-sandbox
        language: system
        pass_filenames: false
        always_run: true
        description: >-
          Asserts the sandbox guard at Makefile lines 51-61 passed: Linux, inside
          WSL2, the devcontainer or CI, and not on a /mnt drive mount.

      # ----------------------------------------------------------------------
      # NOT IMPLEMENTED - parked on the manual stage.
      # Gate: G-WIN-003 (T0, section 74.10.5)
      # Enabled at: M0 (skeleton and toolchain).
      # Reads `git config core.autocrlf` and refuses unless it is false or
      # input. A single CRLF in a golden file changes every downstream hash and
      # silently invalidates certificates, so this is checked on the clone that
      # can introduce it - the author's - rather than only in CI, which would
      # find it one push too late.
      # ----------------------------------------------------------------------
      - id: check-autocrlf
        name: "T0 check-autocrlf / G-WIN-003 (NOT IMPLEMENTED)"
        entry: make check-autocrlf
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        description: >-
          NOT IMPLEMENTED. `manual` here means the target does not exist yet, not
          that the check is optional. Enabled at M0.

      # ----------------------------------------------------------------------
      # NOT IMPLEMENTED - parked on the manual stage.
      # Gate: G-SECRET-001 (T0, section 2)
      # Enabled at: M0 (skeleton and toolchain).
      # Rejects credential-shaped literals, including fake ones that look real.
      # Generated credential material must carry the reserved-looking prefix
      # SPECTRA-SYNTH-. This is a T0 gate rather than only a T1 one because a
      # secret that reaches a remote branch has already leaked; catching it after
      # the push is catching it too late. The T1 tier still scans, in
      # G-SECURITY-SCAN, because a local hook is not authoritative and can be
      # bypassed with --no-verify.
      #
      # TODO(scanner): the scanner binary must be baked into the toolchain image
      #   (74.11.1). Do not add a remote `repo:` entry here to obtain it; that
      #   would put an unpinned network fetch in the commit path.
      # ----------------------------------------------------------------------
      - id: secret-scan
        name: "T0 secret-scan / G-SECRET-001 (NOT IMPLEMENTED)"
        entry: make secret-scan
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        description: >-
          NOT IMPLEMENTED. `manual` here means the target does not exist yet, not
          that the check is optional. Enabled at M0.
